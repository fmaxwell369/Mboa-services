

services:
  # Base de données PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: camerservices_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - mboa_network

  # Cache et Broker de messages Redis
  redis:
    image: redis:7-alpine
    container_name: camerservices_redis
    ports:
      - "6379:6379"
    networks:
      - camerservices_network

  # Notre API Backend Django (Sera construit dans la phase suivante)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: camerservices_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - db
      - redis
    networks:
      - camerservices_network

volumes:
  postgres_data:

networks:
  camerservices_network:
    driver: bridge
